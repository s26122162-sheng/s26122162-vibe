    /* ==========================================
       1. 全局與希臘神話主題背景
       ========================================== */
    :root {
      --primary-blue: #005b96;
      --light-blue: #e3f2fd;
      --gold: #d4af37;
      --light-gold: #f3e5ab;
      --marble-bg: #f9f9fb;
      --card-shadow: 0 10px 25px rgba(0, 91, 150, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Times New Roman', Times, "Noto Serif TC", serif, "PingFang TC", sans-serif;
      background: linear-gradient(180deg, #10316b 0%, #005b96 50%, #6497b1 100%);
      min-height: 100vh;
      color: #2c3e50;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--marble-bg);
      border-radius: 16px;
      padding: 40px 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      border: 6px solid var(--gold);
      position: relative;
      overflow: hidden;
    }

    /* 希臘邊框紋理裝飾 */
    .container::before {
      content: '';
      position: absolute;
      top: 10px; left: 10px; right: 10px; bottom: 10px;
      border: 2px dashed var(--gold);
      pointer-events: none;
      border-radius: 10px;
    }

    /* ==========================================
       2. 標題與希臘柱視覺
       ========================================== */
    header {
      text-align: center;
      margin-bottom: 35px;
      position: relative;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--primary-blue);
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }

    header p {
      color: #666;
      font-style: italic;
      font-size: 0.95rem;
    }

    .fountain-icon {
      font-size: 2.8rem;
      margin-bottom: 10px;
      display: inline-block;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
    }

       ========================================== */
