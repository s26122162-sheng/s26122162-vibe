<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐻 熊熊可愛動態留言板 🐾</title>
    <!-- 引入 Google Fonts 可愛圓潤字體 (Nunito & Zen Maru Gothic) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <!-- 引入 Tailwind CSS 方便快速樣式佈局 -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* ==========================================================================
           【主題顏色與變數設定 (Theme Color Palette)】
           方便後續直接修改此區塊的色彩變數以更換主題顏色
           ========================================================================== */
        :root {
            --bear-bg-main: #FFF8F0;          /* 全局背景色：奶油溫和白 */
            --bear-primary: #D9825B;          /* 主色：焦糖熊熊棕 */
            --bear-primary-hover: #C56F48;    /* 主色 Hover：深焦糖棕 */
            --bear-secondary: #F4C493;        /* 輔色：蜜糖奶茶黃 */
            --bear-accent-pink: #FFB7B2;      /* 強調色：蜜桃粉紅 */
            --bear-card-bg: #FFFFFF;          /* 卡片背景：純白 */
            --bear-text-dark: #5A3E31;        /* 文字主色：深栗棕 */
            --bear-text-light: #8C6D58;       /* 次要文字：淺可可 */
            --bear-highlight-border: #FF80AB; /* 輪播亮起邊框色：可愛粉紅光 */
            --bear-highlight-glow: rgba(255, 128, 171, 0.4); /* 輪播發光效果 */
        }

        body {
            font-family: 'Zen Maru Gothic', 'Nunito', sans-serif;
            background-color: var(--bear-bg-main);
            color: var(--bear-text-dark);
            /* 背景加上可愛熊掌淡紋圖案 */
            background-image: radial-gradient(#E8D5C4 1px, transparent 1px);
            background-size: 24px 24px;
        }

        /* Custom Scrollbar 可愛滾動條 */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #F1E5D8;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--bear-primary);
            border-radius: 10px;
        }

        /* ==========================================================================
           【CSS 瀑布流排版 (Masonry Layout)】
           控制不同螢幕尺寸下的欄位數量 (Column Count)
           ========================================================================== */
        .masonry-grid {
            column-count: 1; /* 手機預設：1 欄 */
            column-gap: 1.25rem;
        }
        @media (min-width: 640px) {
            .masonry-grid { column-count: 2; } /* 平板：2 欄 */
        }
        @media (min-width: 1024px) {
            .masonry-grid { column-count: 3; } /* 電腦桌機：3 欄 */
        }
        @media (min-width: 1280px) {
            .masonry-grid { column-count: 4; } /* 大螢幕：4 欄 */
        }

        .masonry-item {
            break-inside: avoid; /* 防止卡片在瀑布流欄位間被切斷 */
            margin-bottom: 1.25rem;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* ==========================================================================
           【輪播 Highlight 高亮與未選中動畫特效】
           ========================================================================== */
        /* 未選中的卡片：變暗、微模糊、微縮小 */
        .masonry-item.is-dimmed {
            opacity: 0.45;
            filter: blur(1.5px) grayscale(20%);
            transform: scale(0.96);
        }

        /* 被選中的卡片 (Highlight)：放大、發光、置頂、可愛晃動 */
        .masonry-item.is-highlighted {
            opacity: 1 !important;
            filter: blur(0) grayscale(0%) !important;
            transform: scale(1.08) translateY(-6px) !important;
            z-index: 30;
            position: relative;
        }

        .masonry-item.is-highlighted .card-inner {
            border: 3.5px solid var(--bear-highlight-border);
            box-shadow: 0 15px 30px -5px var(--bear-highlight-glow), 0 0 18px var(--bear-highlight-border);
            animation: bearWiggle 0.6s ease-in-out;
        }

        @keyframes bearWiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-2deg); }
            75% { transform: rotate(2deg); }
        }

        /* 熊耳可愛頭飾卡片樣式 */
        .bear-ears-decoration {
            position: relative;
        }
        .bear-ears-decoration::before, .bear-ears-decoration::after {
            content: '';
            position: absolute;
            top: -12px;
            width: 28px;
            height: 28px;
            background-color: var(--bear-secondary);
            border: 3px solid var(--bear-primary);
            border-radius: 50%;
            z-index: 1;
        }
        .bear-ears-decoration::before { left: 16px; }
        .bear-ears-decoration::after { right: 16px; }

        /* 載入中跳動熊掌動畫 */
        @keyframes pawBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.1); }
        }
        .animate-paw-bounce {
            animation: pawBounce 0.8s infinite ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen pb-16 flex flex-col items-center">

    <!-- ==========================================================================
         【網頁頂部 Header / 熊熊造型標題】
         ========================================================================== -->
    <header class="w-full max-w-5xl px-4 pt-8 pb-4 text-center">
        <!-- 可愛的耳朵造型標題盒 -->
        <div class="inline-block relative bear-ears-decoration mb-2">
            <div class="bg-[#F4C493] text-[#5A3E31] px-8 py-3 rounded-3xl border-4 border-[#D9825B] shadow-lg relative z-10 flex items-center gap-2">
                <span class="text-3xl">🐻</span>
                <h1 class="text-2xl md:text-3xl font-black tracking-wide">朋友對我的動態留言板</h1>
                <span class="text-3xl">🐾</span>
            </div>
        </div>
        <p class="text-[#8C6D58] font-bold text-sm md:text-base mt-2">溫馨收集來自好朋友的所有心意與悄悄話 💕</p>
    </header>

    <!-- ==========================================================================
         【控制器與 CSV 網址設定區 (Control Panel)】
         ========================================================================== -->
    <main class="w-full max-w-6xl px-4 flex-1">
        <div class="bg-white/80 backdrop-blur-md rounded-2xl p-4 md:p-6 mb-6 border-2 border-[#E8D5C4] shadow-md transition-all">
            <!-- 展開/收合控制列按鈕與搜尋欄 -->
            <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                <div class="flex items-center gap-2">
                    <span class="bg-[#F4C493] text-[#5A3E31] px-3 py-1 rounded-full text-xs font-extrabold flex items-center gap-1">
                        <span>⚙️</span> 控制面板
                    </span>
                    <button id="toggleConfigBtn" class="text-xs text-[#8C6D58] hover:text-[#D9825B] underline font-bold">
                        [ 切換 CSV 網址設定 ]
                    </button>
                </div>

                <!-- 搜尋過濾功能 -->
                <div class="relative flex-1 max-w-xs">
                    <input type="text" id="searchInput" placeholder="🔍 搜尋名字或內容..." 
                           class="w-full px-4 py-1.5 rounded-full border-2 border-[#E8D5C4] text-sm focus:outline-none focus:border-[#D9825B] bg-[#FFF8F0]/50">
                </div>
            </div>

            <!-- CSV 網址串接區 (預設隱藏，點擊可開啟) -->
            <div id="configPanel" class="hidden border-t-2 border-dashed border-[#E8D5C4] pt-4 mb-4">
                <label class="block text-xs font-bold text-[#5A3E31] mb-1">
                    🔗 Google 試算表 CSV 發佈網址 (欄位順序：時間戳記、名字、悄悄話/留言)：
                </label>
                <div class="flex gap-2">
                    <input type="url" id="csvUrlInput" placeholder="請貼上 Google 試算表發佈的 CSV 連結..."
                           class="flex-1 px-3 py-2 rounded-xl border-2 border-[#E8D5C4] text-xs focus:outline-none focus:border-[#D9825B]">
                    <button id="fetchCsvBtn" class="bg-[#D9825B] hover:bg-[#C56F48] text-white font-bold px-4 py-2 rounded-xl text-xs shadow-sm transition">
                        重新讀取
                    </button>
                    <button id="useMockBtn" class="bg-[#F4C493] hover:bg-[#e0b282] text-[#5A3E31] font-bold px-3 py-2 rounded-xl text-xs transition">
                        載入範例資料
                    </button>
                </div>
            </div>

            <!-- 輪播控制列 (播放/暫停、速度設定、手動前後) -->
            <div class="flex flex-wrap items-center justify-between gap-3 bg-[#FFF8F0] p-3 rounded-xl border border-[#E8D5C4]">
                <div class="flex items-center gap-3">
                    <button id="playPauseBtn" class="bg-[#D9825B] text-white p-2 rounded-full shadow hover:bg-[#C56F48] transition flex items-center justify-center w-9 h-9">
                        <span id="playIcon">⏸️</span>
                    </button>
                    <div class="flex items-center gap-1">
                        <button id="prevBtn" class="px-2 py-1 bg-white border border-[#E8D5C4] rounded-lg text-xs font-bold hover:bg-[#F4C493] transition">◀ 上一張</button>
                        <button id="nextBtn" class="px-2 py-1 bg-white border border-[#E8D5C4] rounded-lg text-xs font-bold hover:bg-[#F4C493] transition">下一張 ▶</button>
                    </div>
                </div>

                <div class="flex items-center gap-4 text-xs font-bold text-[#5A3E31]">
                    <!-- 輪播秒數控制 (Interval Speed) -->
                    <div class="flex items-center gap-2">
                        <label for="speedSelect">⏳ 輪播速度：</label>
                        <select id="speedSelect" class="bg-white border border-[#E8D5C4] rounded-lg px-2 py-1 text-xs focus:outline-none">
                            <option value="2000">2 秒</option>
                            <option value="3000" selected>3 秒 (預設)</option>
                            <option value="5000">5 秒</option>
                            <option value="8000">8 秒</option>
                        </select>
                    </div>

                    <!-- 新增模擬留言按鈕 -->
                    <button id="openModalBtn" class="bg-[#FFB7B2] hover:bg-[#ff9e98] text-[#5A3E31] px-3 py-1.5 rounded-full font-black shadow-sm transition flex items-center gap-1">
                        ✏️ 寫留言
                    </button>
                </div>
            </div>
        </div>

        <!-- ==========================================================================
             【酷炫讀取中動畫 (Loading Animation)】
             ========================================================================== -->
        <div id="loadingState" class="flex flex-col items-center justify-center py-20">
            <div class="relative flex items-center justify-center mb-4">
                <div class="text-6xl animate-paw-bounce">🐾</div>
                <div class="text-4xl absolute -top-2 -right-4">🐻</div>
            </div>
            <p class="text-[#D9825B] font-extrabold text-lg tracking-wider animate-pulse">讀取留言中... 熊熊正在翻箱倒櫃尋找信件 🐾</p>
        </div>

        <!-- 查無資料 State -->
        <div id="emptyState" class="hidden text-center py-16">
            <div class="text-5xl mb-3">🐾</div>
            <p class="text-[#8C6D58] font-bold">目前還沒有留言，或是沒有符合搜尋的內容喔！</p>
        </div>

        <!-- ==========================================================================
             【瀑布流卡片牆容器 (Masonry Wall Display)】
             ========================================================================== -->
        <div id="masonryWall" class="masonry-grid hidden">
            <!-- 動態動態生成的卡片會插入在此處 -->
        </div>
    </main>

    <!-- ==========================================================================
         【新增留言彈出畫框 (Modal Dialog)】
         ========================================================================== -->
    <div id="addModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white rounded-3xl p-6 w-full max-w-md border-4 border-[#F4C493] shadow-2xl relative transform scale-95 transition-transform duration-300">
            <button id="closeModalBtn" class="absolute top-4 right-4 text-[#8C6D58] hover:text-[#D9825B] font-extrabold text-xl">✕</button>
            <div class="flex items-center gap-2 mb-4">
                <span class="text-2xl">📝</span>
                <h3 class="text-lg font-black text-[#5A3E31]">給朋友留個言吧！</h3>
            </div>
            
            <form id="addCommentForm" class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-[#8C6D58] mb-1">你的名字/暱稱：</label>
                    <input type="text" id="inputName" required placeholder="例如：可愛小熊" 
                           class="w-full px-3 py-2 rounded-xl border-2 border-[#E8D5C4] text-sm focus:outline-none focus:border-[#D9825B]">
                </div>
                <div>
                    <label class="block text-xs font-bold text-[#8C6D58] mb-1">留言內容：</label>
                    <textarea id="inputMessage" required rows="3" placeholder="想對他說些什麼呢..." 
                              class="w-full px-3 py-2 rounded-xl border-2 border-[#E8D5C4] text-sm focus:outline-none focus:border-[#D9825B] resize-none"></textarea>
                </div>
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="inputIsSecret" class="w-4 h-4 text-[#D9825B] rounded accent-[#D9825B]">
                    <label for="inputIsSecret" class="text-xs font-bold text-[#D9825B] cursor-pointer">🔒 設為悄悄話 (會呈現粉紅卡片包裝)</label>
                </div>
                <button type="submit" class="w-full bg-[#D9825B] hover:bg-[#C56F48] text-white font-black py-2.5 rounded-2xl shadow-md transition mt-2">
                    送出留言 🐾
                </button>
            </form>
        </div>
    </div>

    <!-- ==========================================================================
         【JAVASCRIPT 邏輯與資料串接】
         ========================================================================== -->
    <script>
        /* --------------------------------------------------------------------------
         * 【全域變數與預設設定】
         * -------------------------------------------------------------------------- */
        // 預設預設 CSV 範例資料 (當發佈網址無法使用或載入測試時使用)
        const MOCK_CSV_DATA = `時間戳記,名字,悄悄話
2026/10/18 下午 2:30:15,小熊阿比,祝你生日快樂！永遠保持可愛，天天開心喔 🎂✨
2026/10/18 下午 3:12:00,蜂蜜罐貓咪,「這是一句悄悄話，只有你知道！」下週一起去吃蜂蜜鬆餅吧 🍯🥞
2026/10/19 上午 09:05:40,森林松鼠,祝你新計畫一切順利，加油！逗號測試，這是內容,特別註明一下～
2026/10/19 上午 10:20:11,極地白熊,天氣轉涼了，記得多穿衣服！「換行測試」
今天也要加油喔！
2026/10/19 下午 01:15:22,粉紅兔兔,認識你真的很幸運！這是一封隱密的小紙條 💌`;

        // 預設 CSV 發佈網址 (可修改此處為您真實發佈的 CSV 連結)
        let csvFetchUrl = '';

        let messagesData = [];      // 解析後的留言陣列
        let filteredData = [];      // 搜尋過濾後的留言陣列
        let currentIndex = 0;       // 目前 Highlights 輪播的索引
        let carouselTimer = null;   // setInterval 定時器物件
        let isPlaying = true;       // 輪播播放狀態
        let carouselInterval = 3000; // 預設輪播秒數：3000 ms (3秒)

        /* --------------------------------------------------------------------------
         * 【DOM 元素選取】
         * -------------------------------------------------------------------------- */
        const masonryWall = document.getElementById('masonryWall');
        const loadingState = document.getElementById('loadingState');
        const emptyState = document.getElementById('emptyState');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const speedSelect = document.getElementById('speedSelect');
        const searchInput = document.getElementById('searchInput');
        const toggleConfigBtn = document.getElementById('toggleConfigBtn');
        const configPanel = document.getElementById('configPanel');
        const csvUrlInput = document.getElementById('csvUrlInput');
        const fetchCsvBtn = document.getElementById('fetchCsvBtn');
        const useMockBtn = document.getElementById('useMockBtn');

        // Modal DOM
        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const addModal = document.getElementById('addModal');
        const addCommentForm = document.getElementById('addCommentForm');

        /* --------------------------------------------------------------------------
         * 【RFC 4180 標準 CSV 解析器】
         * 處理 CSV 中可能包含逗號、雙引號與換行字元的複雜情況
         * -------------------------------------------------------------------------- */
        function parseCSV(text) {
            const result = [];
            let row = [];
            let entry = '';
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                const nextC = text[i + 1];

                if (inQuotes) {
                    if (c === '"' && nextC === '"') {
                        entry += '"';
                        i++; // 跳過轉義的雙引號
                    } else if (c === '"') {
                        inQuotes = false;
                    } else {
                        entry += c;
                    }
                } else {
                    if (c === '"') {
                        inQuotes = true;
                    } else if (c === ',') {
                        row.push(entry.trim());
                        entry = '';
                    } else if (c === '\r' || c === '\n') {
                        if (c === '\r' && nextC === '\n') i++;
                        row.push(entry.trim());
                        if (row.length > 0 && row.some(field => field !== '')) {
                            result.push(row);
                        }
                        row = [];
                        entry = '';
                    } else {
                        entry += c;
                    }
                }
            }
            if (entry || row.length > 0) {
                row.push(entry.trim());
                if (row.some(field => field !== '')) result.push(row);
            }

            // 轉換為物件陣列（假設第一列為標題，或使用預設欄位）
            if (result.length <= 1) return [];

            // 去除 Header，轉換資料欄位：[0]時間戳記, [1]名字, [2]悄悄話/內容
            return result.slice(1).map(r => ({
                timestamp: r[0] || '剛剛',
                name: r[1] || '匿名朋友',
                message: r[2] || '（沒有留下訊息）',
                isSecret: (r[2] && r[2].includes('悄悄話')) || false
            }));
        }

        /* --------------------------------------------------------------------------
         * 【資料 Fetch 讀取與渲染】
         * -------------------------------------------------------------------------- */
        async function loadMessages(url = '') {
            showLoading(true);
            try {
                let csvText = '';
                if (url) {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error('網路回應不成功');
                    csvText = await response.text();
                } else {
                    // 若無網址則使用預設 Mock 模擬資料
                    await new Promise(res => setTimeout(res, 800)); // 模擬網路延遲
                    csvText = MOCK_CSV_DATA;
                }

                messagesData = parseCSV(csvText);
                filteredData = [...messagesData];
                
                renderCards(filteredData);
                startCarousel();
            } catch (error) {
                console.error('Fetch 讀取失敗，退回使用範例資料:', error);
                messagesData = parseCSV(MOCK_CSV_DATA);
                filteredData = [...messagesData];
                renderCards(filteredData);
                startCarousel();
            } finally {
                showLoading(false);
            }
        }

        function showLoading(isLoading) {
            if (isLoading) {
                loadingState.classList.remove('hidden');
                masonryWall.classList.add('hidden');
                emptyState.classList.add('hidden');
            } else {
                loadingState.classList.add('hidden');
            }
        }

        /* --------------------------------------------------------------------------
         * 【渲染卡片 HTML (Render Masonry Cards)】
         * -------------------------------------------------------------------------- */
        function renderCards(data) {
            masonryWall.innerHTML = '';

            if (data.length === 0) {
                masonryWall.classList.add('hidden');
                emptyState.classList.remove('hidden');
                stopCarousel();
                return;
            }

            emptyState.classList.add('hidden');
            masonryWall.classList.remove('hidden');

            // 預設幾組可愛的貼紙圖示與顏色風格庫
            const avatars = ['🐻', '🧸', '🐰', '🦊', '🐱', '🐶', '🐼', '🐨'];
            const bgGradients = [
                'bg-gradient-to-br from-[#FFF8F0] to-[#FFE3D1]',
                'bg-gradient-to-br from-[#FFF0F5] to-[#FFD1DC]',
                'bg-gradient-to-br from-[#F0F8FF] to-[#D0E8FF]',
                'bg-gradient-to-br from-[#F5FFFA] to-[#C1E1C1]'
            ];

            data.forEach((item, index) => {
                const avatar = avatars[index % avatars.length];
                const cardBg = item.isSecret 
                    ? 'bg-gradient-to-br from-[#FFF0F5] to-[#FFC0CB] border-2 border-[#FF80AB]' 
                    : `${bgGradients[index % bgGradients.length]} border-2 border-[#E8D5C4]`;

                const cardEl = document.createElement('div');
                cardEl.className = 'masonry-item cursor-pointer';
                cardEl.dataset.index = index;

                cardEl.innerHTML = `
                    <div class="card-inner ${cardBg} rounded-2xl p-4 shadow-sm hover:shadow-md transition-all relative overflow-hidden">
                        <!-- 悄悄話鎖頭標籤 -->
                        ${item.isSecret ? '<div class="absolute top-2 right-2 text-xs bg-white/80 px-2 py-0.5 rounded-full font-bold text-[#FF80AB] shadow-sm">🔒 悄悄話</div>' : ''}

                        <!-- 頂部頭像與名字 -->
                        <div class="flex items-center gap-2 mb-2">
                            <div class="w-9 h-9 rounded-full bg-white flex items-center justify-center text-xl shadow-inner border border-[#E8D5C4]">
                                ${avatar}
                            </div>
                            <div>
                                <h4 class="font-black text-sm text-[#5A3E31] leading-tight">${escapeHTML(item.name)}</h4>
                                <span class="text-[10px] text-[#8C6D58] font-bold block">${escapeHTML(item.timestamp)}</span>
                            </div>
                        </div>

                        <!-- 留言內文 -->
                        <p class="text-xs text-[#5A3E31] leading-relaxed whitespace-pre-line font-medium bg-white/60 p-2.5 rounded-xl border border-white/80">
                            ${escapeHTML(item.message)}
                        </p>

                        <!-- 可愛熊掌底部點綴 -->
                        <div class="mt-2 flex justify-end text-xs text-[#D9825B]/40 font-bold">
                            🐾
                        </div>
                    </div>
                `;

                // 點擊卡片可手動切換至該卡片 Highlighting
                cardEl.addEventListener('click', () => {
                    currentIndex = index;
                    highlightCard(currentIndex);
                    resetCarouselTimer();
                });

                masonryWall.appendChild(cardEl);
            });

            // 初始化重置索引
            currentIndex = 0;
            highlightCard(currentIndex);
        }

        /* --------------------------------------------------------------------------
         * 【輪播 Highlight 控制邏輯】
         * -------------------------------------------------------------------------- */
        function highlightCard(index) {
            const cards = masonryWall.querySelectorAll('.masonry-item');
            if (cards.length === 0) return;

            cards.forEach((card, idx) => {
                if (idx === index) {
                    card.classList.remove('is-dimmed');
                    card.classList.add('is-highlighted');

                    // 自動對焦/平滑滾動到該高亮卡片 (Scroll into view)
                    card.scrollIntoView({
                        behavior: 'smooth',
                        block: 'nearest'
                    });
                } else {
                    card.classList.remove('is-highlighted');
                    card.classList.add('is-dimmed');
                }
            });
        }

        function nextCard() {
            if (filteredData.length === 0) return;
            currentIndex = (currentIndex + 1) % filteredData.length;
            highlightCard(currentIndex);
        }

        function prevCard() {
            if (filteredData.length === 0) return;
            currentIndex = (currentIndex - 1 + filteredData.length) % filteredData.length;
            highlightCard(currentIndex);
        }

        function startCarousel() {
            stopCarousel();
            if (isPlaying && filteredData.length > 0) {
                carouselTimer = setInterval(nextCard, carouselInterval);
                playIcon.textContent = '⏸️';
            }
        }

        function stopCarousel() {
            if (carouselTimer) {
                clearInterval(carouselTimer);
                carouselTimer = null;
            }
            playIcon.textContent = '▶️';
        }

        function resetCarouselTimer() {
            if (isPlaying) {
                startCarousel();
            }
        }

        /* --------------------------------------------------------------------------
         * 【事件監聽與互動 (Event Listeners)】
         * -------------------------------------------------------------------------- */
        // 播放 / 暫停按鈕
        playPauseBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
                startCarousel();
            } else {
                stopCarousel();
            }
        });

        // 前一張 / 下一張
        prevBtn.addEventListener('click', () => {
            prevCard();
            resetCarouselTimer();
        });
        nextBtn.addEventListener('click', () => {
            nextCard();
            resetCarouselTimer();
        });

        // 修改輪播速度 (Interval Speed)
        speedSelect.addEventListener('change', (e) => {
            carouselInterval = parseInt(e.target.value, 10);
            resetCarouselTimer();
        });

        // 即時搜尋過濾
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            filteredData = messagesData.filter(item => 
                item.name.toLowerCase().includes(query) || 
                item.message.toLowerCase().includes(query)
            );
            renderCards(filteredData);
            resetCarouselTimer();
        });

        // CSV 設定面板收合
        toggleConfigBtn.addEventListener('click', () => {
            configPanel.classList.toggle('hidden');
        });

        // Fetch CSV 網址提交
        fetchCsvBtn.addEventListener('click', () => {
            const url = csvUrlInput.value.trim();
            if (url) {
                csvFetchUrl = url;
                loadMessages(csvFetchUrl);
            } else {
                alert('請先輸入有效的 CSV 網址喔！');
            }
        });

        // 載入預設範例資料按鈕
        useMockBtn.addEventListener('click', () => {
            csvUrlInput.value = '';
            csvFetchUrl = '';
            loadMessages('');
        });

        /* --------------------------------------------------------------------------
         * 【 Modal 彈出框邏輯 (手動新增留言模擬) 】
         * -------------------------------------------------------------------------- */
        openModalBtn.addEventListener('click', () => {
            addModal.classList.remove('opacity-0', 'pointer-events-none');
            addModal.querySelector('div').classList.remove('scale-95');
            addModal.querySelector('div').classList.add('scale-100');
        });

        function closeModal() {
            addModal.classList.add('opacity-0', 'pointer-events-none');
            addModal.querySelector('div').classList.remove('scale-100');
            addModal.querySelector('div').classList.add('scale-95');
        }

        closeModalBtn.addEventListener('click', closeModal);
        addModal.addEventListener('click', (e) => {
            if (e.target === addModal) closeModal();
        });

        addCommentForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('inputName').value.trim();
            const message = document.getElementById('inputMessage').value.trim();
            const isSecret = document.getElementById('inputIsSecret').checked;

            if (!name || !message) return;

            const now = new Date();
            const timeStr = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;

            // 新增至資料頭部
            messagesData.unshift({
                timestamp: timeStr,
                name: name,
                message: message,
                isSecret: isSecret
            });

            filteredData = [...messagesData];
            renderCards(filteredData);
            resetCarouselTimer();

            // 清空表單並關閉 Modal
            addCommentForm.reset();
            closeModal();
        });

        // 工具函式：防 HTML 注入攻擊 (XSS Protection)
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        /* --------------------------------------------------------------------------
         * 【頁面載入完成啟動】
         * -------------------------------------------------------------------------- */
        window.addEventListener('DOMContentLoaded', () => {
            loadMessages(csvFetchUrl);
        });
    </script>
</body>
</html>
