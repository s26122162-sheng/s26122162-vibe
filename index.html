<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh Quest | 網頁前端作品集入口</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --mint-bright: #00f5a0;
            --mint-dark: #00d990;
            --lime-glow: #a8ff78;
            --turquoise-electric: #00d2ff;
            --coral-pop: #ff6b6b;
            --orange-sunrise: #ff9f43;
            --bg-glass: rgba(255, 255, 255, 0.78);
            --bg-glass-locked: rgba(241, 245, 249, 0.55);
            --border-glass: rgba(255, 255, 255, 0.95);
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
            background-color: #f1f5f9;
            color: #0f172a;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Animated Blobs Background */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: linear-gradient(135deg, #e0f2fe 0%, #ecfdf5 50%, #fff7ed 100%);
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.65;
            animation: float-blob 12s ease-in-out infinite alternate;
        }

        .blob-1 {
            width: 420px;
            height: 420px;
            background: var(--mint-bright);
            top: -100px;
            left: -80px;
        }

        .blob-2 {
            width: 480px;
            height: 480px;
            background: var(--coral-pop);
            bottom: -120px;
            right: -100px;
            animation-delay: -4s;
        }

        .blob-3 {
            width: 360px;
            height: 360px;
            background: var(--turquoise-electric);
            top: 35%;
            right: 10%;
            animation-delay: -8s;
        }

        .blob-4 {
            width: 300px;
            height: 300px;
            background: var(--lime-glow);
            bottom: 20%;
            left: 15%;
            animation-delay: -2s;
        }

        @keyframes float-blob {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(45px, 55px) scale(1.15); }
            100% { transform: translate(-35px, 75px) scale(0.92); }
        }

        /* Vibrant Glassmorphism Card */
        .glass-card {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid var(--border-glass);
            box-shadow: 0 20px 40px -15px rgba(0, 217, 144, 0.12),
                        0 10px 20px -5px rgba(0, 0, 0, 0.04);
        }

        /* Rainbow Avatar Glow Ring */
        .avatar-glow {
            position: relative;
            padding: 5px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--mint-bright), var(--turquoise-electric), var(--coral-pop), var(--lime-glow));
            background-size: 300% 300%;
            animation: ring-gradient 5s ease infinite;
            box-shadow: 0 12px 30px rgba(0, 245, 160, 0.4);
        }

        @keyframes ring-gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Unlocked Buttons Fresh Styling & Hover Effects */
        .btn-unlocked {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(236, 253, 245, 0.85) 100%);
            border: 1.5px solid rgba(0, 217, 144, 0.35);
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .btn-unlocked::before {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.85), transparent);
            transform: skewX(-20deg);
            transition: left 0.75s ease;
        }

        .btn-unlocked:hover::before {
            left: 150%;
        }

        .btn-unlocked:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: #00d990;
            box-shadow: 0 20px 30px -10px rgba(0, 217, 144, 0.32),
                        0 8px 15px -3px rgba(0, 0, 0, 0.05);
        }

        /* Locked Buttons Styling & Playful Lock Shake */
        .btn-locked {
            background: var(--bg-glass-locked);
            border: 1.5px dashed rgba(148, 163, 184, 0.45);
            color: #94a3b8;
            cursor: not-allowed;
            transition: all 0.3s ease;
        }

        .btn-locked:hover {
            background: rgba(248, 250, 252, 0.9);
            border-color: rgba(255, 107, 107, 0.6);
            color: #64748b;
